name: iOS Build

# 触发：推送到 main/master，或在 GitHub 页面手动触发（Actions → iOS Build → Run workflow）
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---- 第一步：模拟器构建（验证编译通过，无需证书）----
      - name: Build for Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project MiaoyuApp.xcodeproj \
            -scheme MiaoyuApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-sim.log

      # ---- 失败时把编译错误行转成注解（Actions 页面/API 可直接读到）----
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:" build-sim.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- build-sim.log tail ---"
          tail -n 30 build-sim.log | head -c 3000 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- diagnostics ---"
          {
            echo "PWD: $(pwd)"
            echo "LS:"; ls -la | head -25
            echo "XCODEGEN: $(xcodegen --version 2>&1)"
            echo "PROJECT DIR:"; ls -la MiaoyuApp.xcodeproj 2>&1 | head -10
          } | while IFS= read -r line; do
            echo "::error::$line"
          done

      # ---- 失败时把编译日志挂到 Release（公开仓库可匿名直接下载）----
      - name: Upload log as release asset
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ci-logs --title "CI build logs" --notes "auto-uploaded on failure" || true
          gh release upload ci-logs build-sim.log --clobber || true

      # ---- 第二步：真机未签名 ipa（下载后用 Sideloadly/AltStore/爱思助手自签安装）----
      - name: Build unsigned device IPA
        if: success()
        run: |
          set -o pipefail
          xcodebuild -project MiaoyuApp.xcodeproj \
            -scheme MiaoyuApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Release-iphoneos/*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MiaoyuApp-unsigned.ipa Payload

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: warn

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoyuApp-simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoyuApp-unsigned-ipa
          path: MiaoyuApp-unsigned.ipa
          if-no-files-found: error

      # ---- 安装级自检：这三样都真机翻车过，别靠人肉发现 ----
      # ① 图标有没有编进 Assets.car；② 键盘扩展在不在包里、RequestsOpenAccess 是不是 true
      # （不是 true 时系统设置里根本不显示「允许完全访问」）；③ 键盘包里有没有精简词库
      # （没有的话中文候选永远为空，键盘看起来「能按但不出字」）。
      # 放在上传之后：自检失败把这次运行标红，但产物已经能下载。
      - name: Verify IPA payload (icon / keyboard extension / lexicon)
        if: success()
        run: |
          set -u
          fail=0
          APP=$(find Payload -maxdepth 1 -name '*.app' | head -n 1)
          echo "APP=$APP"

          if [ -f "$APP/Assets.car" ]; then
            echo "OK  Assets.car 存在（图标已编译）"
          else
            echo "::error::包内缺 Assets.car，图标又被漏编了（装到手机就是白方块）"
            fail=1
          fi

          ICON=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist" 2>/dev/null || true)
          echo "CFBundleIconName=${ICON:-<空>}"
          [ -n "$ICON" ] || { echo "::error::Info.plist 缺 CFBundleIconName"; fail=1; }

          KB=""
          for appex in "$APP"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            point=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist" 2>/dev/null || true)
            echo "appex: $(basename "$appex") -> ${point:-<未知>}"
            if [ "$point" = "com.apple.keyboard-service" ]; then KB="$appex"; fi
          done

          if [ -n "$KB" ]; then
            RA=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess' "$KB/Info.plist" 2>/dev/null || echo '<缺>')
            echo "RequestsOpenAccess=$RA"
            [ "$RA" = "true" ] || { echo "::error::键盘扩展 RequestsOpenAccess 不是 true，设置里不会出现「允许完全访问」开关"; fail=1; }
            if [ -f "$KB/lexicon.json" ]; then
              echo "OK  键盘词库 $(du -h "$KB/lexicon.json" | cut -f1)"
            else
              echo "::error::键盘包里没有 lexicon.json，中文候选永远出不来"
              fail=1
            fi
          else
            echo "::error::包内没有键盘扩展（PlugIns 里找不到 com.apple.keyboard-service）"
            fail=1
          fi

          echo "--- ipa 结构 ---"
          unzip -l MiaoyuApp-unsigned.ipa | head -30
          exit $fail
