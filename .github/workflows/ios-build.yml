name: iOS Build

# 触发：推送到 main/master，或在 GitHub 页面手动触发（Actions → iOS Build → Run workflow）
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # ---- 第一步：模拟器构建（验证编译通过，无需证书）----
      - name: Build for Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project MiaoyuApp.xcodeproj \
            -scheme MiaoyuApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-sim.log

      # ---- 失败时把编译错误行转成注解（Actions 页面/API 可直接读到）----
      - name: Report compile errors
        if: failure()
        run: |
          grep -E "error:" build-sim.log | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- build-sim.log tail ---"
          tail -n 30 build-sim.log | head -c 3000 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- diagnostics ---"
          {
            echo "PWD: $(pwd)"
            echo "LS:"; ls -la | head -25
            echo "XCODEGEN: $(xcodegen --version 2>&1)"
            echo "PROJECT DIR:"; ls -la MiaoyuApp.xcodeproj 2>&1 | head -10
          } | while IFS= read -r line; do
            echo "::error::$line"
          done

      # ---- 第二步：真机未签名 ipa（下载后用 Sideloadly/AltStore/爱思助手自签安装）----
      - name: Build unsigned device IPA
        if: success()
        run: |
          set -o pipefail
          xcodebuild -project MiaoyuApp.xcodeproj \
            -scheme MiaoyuApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Release-iphoneos/*.app' | head -n 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MiaoyuApp-unsigned.ipa Payload

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: warn

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoyuApp-simulator
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiaoyuApp-unsigned-ipa
          path: MiaoyuApp-unsigned.ipa
          if-no-files-found: error
