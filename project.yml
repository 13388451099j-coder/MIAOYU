name: MiaoyuApp
options:
  bundleIdPrefix: com.miaoyu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  MiaoyuApp:
    type: application
    platform: iOS
    sources:
      - path: MiaoyuApp
      - path: SharedKit
      # 显式排掉键盘专用的精简词库：资源和 PinyinKit/Resources/lexicon.json 同名，
      # 两个文件都会平铺到 bundle 根目录，xcodebuild 会报 “Multiple commands produce …/lexicon.json”。
      - path: PinyinKit
        excludes:
          - "ResourcesKeyboard/lexicon.json"
      - path: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miaoyu.zuiti
        PRODUCT_NAME: 妙语
        INFOPLIST_FILE: MiaoyuApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: MiaoyuApp/MiaoyuApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 妙语
        # AppIcon 在 MiaoyuApp/Assets.xcassets 里（由 tools/make-app-icon.ps1 生成）。
        # 不写这行时 actool 不会把图标编进 Assets.car，Info.plist 里的
        # CFBundleIconName=AppIcon 指向一个不存在的图标，装到手机上就是白方块。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MiaoyuKeyboard
        embed: true
      - target: MiaoyuLive
        embed: true
  MiaoyuKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: MiaoyuKeyboard
      - path: SharedKit
      # 键盘扩展挂的是精简词库（见 tools/build-keyboard-lexicon.mjs）：
      # 扩展进程内存上限只有几十 MB，4.8MB 完整词库解出来的常驻峰值容易顶到上限。
      # 只留精简词库（lexicon.json 这个名字在键盘包里唯一），完整词库与键盘版同名会撞车。
      - path: PinyinKit
        excludes:
          - "Resources/lexicon.json"
          - "ResourcesKeyboard/lexicon.json"
      - path: PinyinKit/ResourcesKeyboard
      # 只挂快照与解析：键盘要读 App Group 里的直播结果，但不需要 Vision，
      # 把 LiveOCREngine 拖进键盘只会白占内存。
      - path: LiveKit/LiveSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miaoyu.zuiti.keyboard
        PRODUCT_NAME: 妙语键盘
        # 与 MiaoyuLive 同理：模块名若由中文 PRODUCT_NAME 派生，会被 c99extidentifier
        # 清成一串下划线，Info.plist 里 $(PRODUCT_MODULE_NAME).KeyboardViewController
        # 就指向一个系统找不到的类（键盘一弹出就被杀）。这里钉死成 ASCII。
        PRODUCT_MODULE_NAME: MiaoyuKeyboard
        INFOPLIST_FILE: MiaoyuKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: MiaoyuKeyboard/MiaoyuKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  # 直播模式：ReplayKit 广播上传扩展。录屏 → 本地 OCR（Vision）→ 快照写 App Group，
  # 键盘与主 App 读快照出候选。三 target 必须同一 Team 签名并声明同一个 App Group。
  # 只挂 LiveKit，别把 SharedKit / SwiftUI / 词库拖进这个 ~50MB 内存上限的进程。
  MiaoyuLive:
    type: app-extension
    platform: iOS
    sources:
      - path: MiaoyuLive
      - path: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miaoyu.zuiti.live
        PRODUCT_NAME: 妙语直播
        # 显式钉住模块名：Info.plist 里 NSExtensionPrincipalClass 是
        # $(PRODUCT_MODULE_NAME).LiveBroadcastHandler，若模块名由中文 PRODUCT_NAME 派生，
        # 可能被 c99extidentifier 清成非法标识符导致扩展类找不到（启动即被系统杀掉）。
        PRODUCT_MODULE_NAME: MiaoyuLive
        INFOPLIST_FILE: MiaoyuLive/Info.plist
        CODE_SIGN_ENTITLEMENTS: MiaoyuLive/MiaoyuLive.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
schemes:
  MiaoyuApp:
    build:
      targets:
        MiaoyuApp: all
        MiaoyuKeyboard: [all]
        MiaoyuLive: [all]
    run:
      config: Debug
    test:
      config: Debug
